# ═══════════════════════════════════════════════════════════════════════════════════
# nginx como proxy inverso para hackwithdsc.
#
# Dónde va este archivo en la MV (Ubuntu Server):
#   /etc/nginx/sites-available/hackwithdsc.conf
#   ln -s /etc/nginx/sites-available/hackwithdsc.conf /etc/nginx/sites-enabled/
#
# ORDEN IMPORTANTE: instala este archivo SIN los bloques de TLS (o sea, solo el primer
# server de abajo, el del puerto 80), corre certbot, y certbot agrega el bloque 443 y
# los certificados solo. Instrucciones completas en docs/despliegue.md.
#
# Antes de recargar, siempre: sudo nginx -t
# ═══════════════════════════════════════════════════════════════════════════════════

# Reemplaza hackwithdsc.pucp.edu.pe por el dominio real en TODO el archivo.

# Compresión. Ahorra ~70% en HTML/CSS/JS. Next ya sirve los assets con hash y
# cache-control largo; esto es para el resto.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  image/svg+xml;

# Límite de peticiones por IP. No es un antiDDoS, pero corta el escaneo automático
# tonto sin afectar a una persona navegando.
limit_req_zone $binary_remote_addr zone=hackwithdsc:10m rate=30r/s;

server {
  listen 80;
  listen [::]:80;
  server_name hackwithdsc.pucp.edu.pe;

  # Certbot escribe acá para probar que el dominio es tuyo. Tiene que quedar accesible
  # por HTTP incluso después de activar HTTPS, o la renovación automática falla.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Todo lo demás se va a HTTPS.
  # ⚠️ Deja esta línea COMENTADA hasta que certbot haya emitido el certificado. Si la
  # activas antes, certbot no puede validar y te quedas sin sitio.
  # return 301 https://$host$request_uri;

  # Mientras no haya certificado, el sitio se sirve por aquí.
  location / {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/proxy_params;
  }
}

